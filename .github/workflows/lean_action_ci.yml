name: Build project and documentation

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read  # Read access to repository contents
  id-token: write # Required to upload the site to GitHub Pages
  pages: write    # Write access to GitHub Pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and lint the project
        id: build-lean
        uses: leanprover/lean-action@v1

      # API documentation is published at:
      #   https://negus333-conjecturepassion.github.io/Goldbach-sieve-density/docs
      # build-page is false because this project has no Jekyll site in docs/;
      # leaving it on produces an empty root and a 404 at the site root.
      - name: Build project documentation
        id: build-docgen
        uses: leanprover-community/docgen-action@main
        with:
          build-page: false

      # The verified core is Goldbach/Basic.lean. It must contain no proof
      # holes and no axioms. Goldbach/Phase4b_Draft.lean is exploratory work
      # and is deliberately NOT checked here -- it carries one openly marked
      # gap, as documented in the README.
      - name: Check verified core for sorry
        run: |
          if grep -n "sorry" Goldbach/Basic.lean; then
            echo "::error::Found 'sorry' in Goldbach/Basic.lean - verified core is not clean."
            exit 1
          else
            echo "No 'sorry' in verified core."
          fi

      - name: Check verified core for axioms
        run: |
          if grep -n "^axiom" Goldbach/Basic.lean; then
            echo "::error::Found 'axiom' in Goldbach/Basic.lean - verified core is not clean."
            exit 1
          else
            echo "No 'axiom' in verified core."
          fi
